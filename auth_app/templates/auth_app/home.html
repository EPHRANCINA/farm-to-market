<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm to Market - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Farm to Market</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'users:dashboard' %}">Dashboard</a>
                    <a class="nav-link" href="{% url 'users:profile' %}">Profile</a>
                    <a class="nav-link" href="{% url 'users:logout' %}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{% url 'users:login' %}">Login</a>
                    <a class="nav-link" href="{% url 'users:register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2 text-center">
                <h1 class="display-4">Welcome to Farm to Market</h1>
                <p class="lead">Connect farmers directly with buyers in a seamless marketplace</p>
                {% if not user.is_authenticated %}
                    <div class="mt-4">
                        <a href="{% url 'users:register' %}" class="btn btn-success btn-lg me-3">Register Now</a>
                        <a href="{% url 'users:login' %}" class="btn btn-outline-success btn-lg">Login</a>
                    </div>
                {% else %}
                    <div class="mt-4">
                        <a href="{% url 'users:dashboard' %}" class="btn btn-success btn-lg">Go to Dashboard</a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
